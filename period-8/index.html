<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <!-- ios-pwa -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Period 8">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <script src="ios.js"></script>
  <!-- /ios-pwa -->
  <meta name="theme-color" content="#0a090c">
  <meta name="description" content="Period 8: a school anomaly horror game. Loop the hallway outside Room 8. If anything is different, turn back. Eight in a row and the final bell rings.">
  <title>Period 8</title>
  <link rel="icon" href="icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Loading bar with the logo (no splash screens on portals). Removed as soon as the first screen takes input. -->
  <div id="boot" style="position:fixed;inset:0;z-index:60;display:grid;place-content:center;gap:14px;background:#0a090c;color:#f6efdc;font:900 34px system-ui,sans-serif;letter-spacing:.06em;text-align:center">
    <div>PERIOD <span style="color:#f2c94c">8</span></div>
    <div style="width:180px;height:6px;border-radius:3px;background:#2a2530;overflow:hidden"><i id="bootBar" style="display:block;height:100%;width:15%;background:#f2c94c;transition:width .3s"></i></div>
  </div>
  <canvas id="view" aria-label="Look around: drag to turn, pinch to zoom, tap to inspect"></canvas>

  <section id="title" class="screen">
    <div class="logo"><small>an after-school anomaly game</small><h1>PERIOD <b>8</b></h1></div>
    <button id="locker" class="locker" aria-label="Your locker: stickers and flashlight colours"><span class="lk-door"><i class="lk-vent"></i><span id="lkStickers" class="lk-stickers"></span><i class="lk-handle"></i></span><small>Your locker</small></button>
    <div class="menu">
      <p id="endingCount" class="dim"></p>
      <div class="menu-row">
        <button class="btn" id="btnClip">Clip mode</button>
        <button class="btn" id="btnEndings">Notebook</button>
        <button class="btn sq" id="btnTitleSettings" aria-label="Settings">⚙</button>
      </div>
      <button class="btn" id="btnNew" hidden>New run</button>
      <button class="btn primary big play" id="btnContinue" hidden>Continue</button>
      <button class="btn primary big play" id="btnStart">Play</button>
      <p class="foot">Headphones recommended · Gore-free · by Diddlerrr</p>
    </div>
  </section>

  <section id="hud" hidden>
    <header class="top">
      <button id="btnPause" class="icon" aria-label="Pause">❚❚</button>
      <div class="count"><div id="pips" class="pips"></div><span id="loopNum">0/8</span><small id="misses"></small></div>
      <span id="passIcon" class="pass" hidden title="Golden hall pass">🎫</span>
      <button id="btnShot" class="icon" aria-label="Screenshot">◉</button>
    </header>
    <div id="compass" class="compass"><div class="track"></div><i class="mark"></i></div>
    <div class="timers"><span id="speed" class="speed" hidden>0:00.00</span><span id="loopTimer" class="looptimer" hidden></span></div>
    <button id="btnHint" class="hint"><span class="tv">▶</span> Hint</button>
    <footer class="choices">
      <button id="btnBack" class="choice back">↩ Turn back</button>
      <button id="btnFwd" class="choice fwd">Keep going →</button>
    </footer>
  </section>

  <section id="clip" class="clip" hidden>
    <canvas aria-label="Spot the anomaly: tap it in the bottom picture"></canvas>
    <button id="clipExit" class="icon clip-exit" aria-label="Exit clip mode">✕</button>
    <div class="clip-result card" hidden>
      <h2>Spotted</h2><div class="res-score">0/10</div><p class="res-sub"></p>
      <div class="row col"><button class="btn primary" id="clipAgain">Again</button><button class="btn" id="clipSave">Save result card</button></div>
    </div>
  </section>

  <section id="ending" class="screen ending" hidden>
    <canvas id="endArt" width="900" height="600"></canvas>
    <p id="endTag" class="dim"></p><h1 id="endTitle"></h1><p id="endBlurb"></p><p id="endStats" class="dim"></p>
    <div class="row col"><button class="btn primary" id="btnEndAgain">Play again</button><button class="btn" id="btnEndShot">Save picture</button><button class="btn" id="btnEndTitle">Title</button></div>
  </section>

  <div id="coldopen" class="coldopen" hidden><p id="coLine" class="co-line"></p><button id="coSkip" class="btn co-skip">Skip ›</button></div>
  <div id="big" class="bigtext"></div>
  <canvas id="scare" class="scare" hidden></canvas>
  <div id="flash" class="flash"></div>
  <div id="modal" class="modal" hidden><div class="card" id="modalCard"></div></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
