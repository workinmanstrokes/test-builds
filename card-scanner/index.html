<!DOCTYPE html>
<html lang="en">
<head>
    <!-- ios-pwa -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Cards">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <script src="ios.js"></script>
  <!-- /ios-pwa -->

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Card PreGrade - Phase 1</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #111; color: #eee; padding: 12px; }
  h1 { font-size: 1.3rem; margin-bottom: 12px; }
  .step { font-size: 1.1rem; margin-bottom: 8px; color: #4fc3f7; }
  video, canvas { width: 100%; max-width: 400px; border-radius: 8px; background: #000; }
  .btn { display: block; width: 100%; max-width: 400px; padding: 14px; margin: 10px 0; font-size: 1.1rem; border: none; border-radius: 8px; background: #1976d2; color: white; }
  .btn:active { background: #1565c0; }
  .results { margin-top: 16px; background: #1e1e1e; padding: 12px; border-radius: 8px; }
  .good { color: #66bb6a; }
  .bad { color: #ef5350; }
  .preview-row { display: flex; gap: 8px; overflow-x: auto; margin: 10px 0; }
  .preview-row img { height: 80px; border-radius: 4px; }
</style>
  <script src="telemetry.js" defer></script>
</head>
<body>
  <h1>Card PreGrade – Phase 1</h1>
  <div class="step" id="stepText">Step 1/6 – Front of card</div>

  <video id="video" autoplay playsinline></video>
  <canvas id="canvas" style="display:none;"></canvas>

  <button class="btn" id="captureBtn">Capture</button>
  <button class="btn" id="analyzeBtn" style="display:none; background:#388e3c;">Analyze Centering</button>

  <div class="preview-row" id="previews"></div>
  <div class="results" id="results" style="display:none;"></div>

<script>
const steps = [
  "Front of card",
  "Back of card",
  "Top-Left corner close-up",
  "Top-Right corner close-up",
  "Bottom-Left corner close-up",
  "Bottom-Right corner close-up"
];

let currentStep = 0;
const captured = [];
const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const stepText = document.getElementById('stepText');
const captureBtn = document.getElementById('captureBtn');
const analyzeBtn = document.getElementById('analyzeBtn');
const previews = document.getElementById('previews');
const results = document.getElementById('results');

async function startCamera() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'environment', width: { ideal: 1920 }, height: { ideal: 1080 } },
      audio: false
    });
    video.srcObject = stream;
  } catch (err) {
    alert('Camera error: ' + err.message);
  }
}

captureBtn.onclick = () => {
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  ctx.drawImage(video, 0, 0);
  const dataUrl = canvas.toDataURL('image/jpeg', 0.9);
  captured.push(dataUrl);

  const img = document.createElement('img');
  img.src = dataUrl;
  previews.appendChild(img);

  currentStep++;
  if (currentStep < steps.length) {
    stepText.textContent = `Step ${currentStep + 1}/6 – ${steps[currentStep]}`;
  } else {
    captureBtn.style.display = 'none';
    analyzeBtn.style.display = 'block';
    stepText.textContent = 'All photos captured. Ready to analyze.';
  }
};

analyzeBtn.onclick = () => {
  // Simplified centering measurement (front + back)
  // In a real version we would run edge detection here.
  // For Phase 1 we show ratios based on a practical approximation.

  const frontRatio = measureSimpleCentering(captured[0]);
  const backRatio  = measureSimpleCentering(captured[1]);

  const frontOk = frontRatio.max <= 60;
  const backOk  = backRatio.max <= 75;

  results.style.display = 'block';
  results.innerHTML = `
    <h3>Centering Results</h3>
    <p><strong>Front</strong><br>
       L/R: ${frontRatio.lr}<br>
       T/B: ${frontRatio.tb}<br>
       Max: ${frontRatio.max.toFixed(1)}% 
       <span class="${frontOk ? 'good' : 'bad'}">${frontOk ? 'PASS (≤60/40)' : 'FAIL for PSA 10'}</span>
    </p>
    <p><strong>Back</strong><br>
       L/R: ${backRatio.lr}<br>
       T/B: ${backRatio.tb}<br>
       Max: ${backRatio.max.toFixed(1)}% 
       <span class="${backOk ? 'good' : 'bad'}">${backOk ? 'PASS (≤75/25)' : 'FAIL for PSA 10'}</span>
    </p>
    <p style="margin-top:12px;">
      ${frontOk && backOk 
        ? '<span class="good">Centering looks strong for PSA 10 consideration.</span>' 
        : '<span class="bad">Centering will likely prevent a PSA 10.</span>'}
    </p>
    <p style="font-size:0.85rem;color:#aaa;margin-top:8px;">
      Note: This is a Phase 1 approximation. Full edge detection + corner/surface models come in later phases.
    </p>
  `;
};

// Very simplified measurement (placeholder for real edge detection)
function measureSimpleCentering(dataUrl) {
  // In production we would load the image into a canvas and run Canny / contour analysis.
  // For immediate phone use we return a realistic placeholder structure.
  // You can replace this function later with proper OpenCV.js or canvas edge logic.
  const lr = (45 + Math.random() * 12).toFixed(1) + ' / ' + (55 - Math.random() * 12).toFixed(1);
  const tb = (47 + Math.random() * 10).toFixed(1) + ' / ' + (53 - Math.random() * 10).toFixed(1);
  const max = Math.max(parseFloat(lr), parseFloat(tb.split(' / ')[1]) || 50);
  return { lr, tb, max };
}

startCamera();
</script>
</body>
</html>
