<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <!-- ios-pwa -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Brainrot: Ta">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <meta name="theme-color" content="#0f172a">
  <script src="ios.js"></script>
  <!-- /ios-pwa -->
  <title>Brainrot: Tactical Aura Rush</title>
  <link rel="icon" href="data:,">
  <style>
    @font-face { font-family: 'GameFont'; src: url('fonts/ArchivoBlack-Regular.ttf') format('truetype'); font-display: swap; }
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; touch-action: none; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: #0f172a; font-family: 'GameFont', 'Arial Black', Impact, 'Roboto', 'Helvetica Neue', Arial, sans-serif; }
    canvas#gameCanvas { display: block; width: 100vw; height: 100vh; }

    #ui { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; display: none; }

    .top-bar { position: absolute; top: max(env(safe-area-inset-top, 0px), 14px); left: 12px; right: 12px; display: flex; flex-direction: column; gap: 10px; }
    .stats-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; color: #fff; font-size: 14px; text-shadow: 0 2px 6px rgba(0,0,0,0.9); }
    .right-group { display: flex; align-items: center; gap: 8px; }
    .badge { background: rgba(15, 23, 42, 0.92); padding: 7px 14px; border-radius: 20px; border: 2px solid #38bdf8; box-shadow: 0 4px 14px rgba(56, 189, 248, 0.4); display: flex; align-items: center; gap: 6px; white-space: nowrap; }
    .icon-btn { pointer-events: auto; width: 38px; height: 38px; border-radius: 50%; border: 2px solid #94a3b8; background: rgba(15,23,42,0.92); color: #fff; font-size: 16px; display: flex; align-items: center; justify-content: center; cursor: pointer; font-family: sans-serif; }
    .icon-btn:active { transform: scale(0.92); }

    .progress-container { width: 100%; height: 12px; background: rgba(15,23,42,0.9); border: 2px solid #334155; border-radius: 8px; overflow: hidden; position: relative; }
    .progress-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #38bdf8, #facc15, #ec4899); box-shadow: 0 0 10px #facc15; transition: width 0.1s linear; }

    .tier-announcement { position: absolute; top: calc(max(env(safe-area-inset-top, 0px), 14px) + 78px); left: 50%; transform: translateX(-50%); color: #38bdf8; font-size: 16px; text-shadow: 0 3px 0 #0369a1, 0 0 14px rgba(56, 189, 248, 0.7); text-transform: uppercase; letter-spacing: 1px; white-space: nowrap; transition: transform 0.2s; }
    .tier-pop { transform: translateX(-50%) scale(1.3) !important; color: #fff !important; text-shadow: 0 0 20px #facc15 !important; }

    .modal { position: absolute; inset: 0; background: rgba(2, 6, 23, 0.9); backdrop-filter: blur(6px); display: flex; flex-direction: column; align-items: center; justify-content: center; pointer-events: auto; z-index: 100; }
    .card { background: linear-gradient(180deg, #1e1b4b 0%, #0f172a 100%); border: 4px solid #38bdf8; border-radius: 24px; padding: 24px 20px; text-align: center; width: 88%; max-width: 360px; box-shadow: 0 16px 50px rgba(56, 189, 248, 0.3); animation: slideUp 0.4s ease-out; }
    @keyframes slideUp { from { transform: translateY(40px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    .card h1 { font-size: 28px; color: #38bdf8; margin-bottom: 10px; text-transform: uppercase; text-shadow: 0 4px 0 #0369a1; font-weight: normal; }
    .card p { font-size: 15px; color: #cbd5e1; margin-bottom: 18px; font-family: 'Roboto', 'Helvetica Neue', Arial, sans-serif; font-weight: bold; line-height: 1.4; }
    .card p.best { font-size: 13px; color: #facc15; margin: -8px 0 16px; }

    .btn { background: linear-gradient(180deg, #38bdf8 0%, #0284c7 100%); border: 2px solid #bae6fd; color: #0f172a; font-family: inherit; font-size: 19px; padding: 14px 28px; border-radius: 16px; cursor: pointer; box-shadow: 0 8px 20px rgba(56, 189, 248, 0.5); text-transform: uppercase; letter-spacing: 1px; width: 100%; transition: transform 0.1s; }
    .btn:active { transform: scale(0.95); }
    .btn.gold { background: linear-gradient(180deg, #facc15 0%, #ca8a04 100%); border-color: #fef08a; box-shadow: 0 8px 20px rgba(250, 204, 21, 0.4); }
    .btn.ghost { background: transparent; color: #e2e8f0; border-color: #475569; box-shadow: none; font-size: 15px; padding: 10px; margin-top: 10px; }

    #shop { display: none; flex-direction: column; gap: 8px; margin: -4px 0 16px; }
    #shop h2 { font-size: 13px; color: #facc15; letter-spacing: 1px; font-weight: normal; }
    .upg { display: flex; align-items: center; gap: 10px; text-align: left; background: rgba(15,23,42,0.85); border: 2px solid #334155; border-radius: 14px; padding: 8px 10px; color: #fff; font-family: inherit; cursor: pointer; width: 100%; }
    .upg:not(:disabled):active { transform: scale(0.97); }
    .upg:disabled { opacity: 0.45; cursor: default; }
    .upg .ico { font-size: 20px; width: 26px; text-align: center; font-family: sans-serif; }
    .upg .txt { flex: 1; display: flex; flex-direction: column; gap: 2px; }
    .upg .nm { font-size: 13px; }
    .upg .ds { font-size: 11px; color: #94a3b8; font-family: 'Roboto', Arial, sans-serif; font-weight: bold; }
    .upg .pips { font-size: 10px; color: #38bdf8; letter-spacing: 2px; font-family: sans-serif; }
    .upg .cost { font-size: 13px; color: #facc15; white-space: nowrap; }

    #metaShop .card { max-height: 92vh; overflow-y: auto; touch-action: pan-y; }
    #metaList { display: flex; flex-direction: column; gap: 8px; margin: 4px 0 14px; }
    .essence { font-size: 14px; color: #c4b5fd; margin: -6px 0 14px; font-family: 'Roboto', Arial, sans-serif; font-weight: bold; }
    .btn.violet { background: linear-gradient(180deg, #a78bfa 0%, #6d28d9 100%); border-color: #ddd6fe; color: #fff; box-shadow: 0 8px 20px rgba(139, 92, 246, 0.45); margin-top: 10px; font-size: 16px; padding: 11px 20px; }
    .btn.ad { background: linear-gradient(180deg, #4ade80 0%, #16a34a 100%); border-color: #bbf7d0; color: #052e16; box-shadow: 0 8px 20px rgba(74, 222, 128, 0.35); font-size: 15px; padding: 11px 16px; margin-bottom: 10px; }
    .btn.ad:disabled { opacity: 0.5; }
    .btn.chest { background: linear-gradient(180deg, #f472b6 0%, #be185d 100%); border-color: #fbcfe8; color: #fff; box-shadow: 0 8px 20px rgba(236, 72, 153, 0.4); margin-top: 10px; font-size: 16px; padding: 11px 20px; }
    #chestBox p { margin: 10px 0 0; font-size: 13px; color: #f9a8d4; }
    #chestBox .btn.ad { margin: 8px 0 0; }
    .legal { margin-top: 14px; display: flex; justify-content: center; gap: 14px; align-items: center; font-family: 'Roboto', Arial, sans-serif; font-size: 12px; }
    .legal a, .legal button { color: #94a3b8; background: none; border: none; text-decoration: underline; font: inherit; cursor: pointer; pointer-events: auto; }
    #hint { position: absolute; top: 58%; left: 50%; transform: translateX(-50%); color: #fff; font-size: 16px; letter-spacing: 2px; animation: pulse 1s infinite alternate; text-shadow: 0 2px 4px #000; white-space: nowrap; }
    @keyframes pulse { from { opacity: 0.55; } to { opacity: 1; } }

    #bossUI { position: absolute; top: calc(max(env(safe-area-inset-top, 0px), 14px) + 112px); left: 50%; transform: translateX(-50%); width: 80%; display: none; flex-direction: column; align-items: center; gap: 6px; }
    #bossUI span { color: #ef4444; font-size: 16px; text-shadow: 0 2px 4px #000; letter-spacing: 2px; }
    .boss-hp-container { width: 100%; height: 14px; background: rgba(0,0,0,0.8); border: 2px solid #7f1d1d; border-radius: 8px; overflow: hidden; }
    .boss-hp-fill { height: 100%; width: 100%; background: linear-gradient(90deg, #ef4444, #dc2626); transition: width 0.1s; }

    #damageOverlay { position: absolute; inset: 0; background: radial-gradient(circle, transparent 40%, rgba(239,68,68,0.45) 100%); opacity: 0; pointer-events: none; }
    #slowmoOverlay { position: absolute; inset: 0; box-shadow: inset 0 0 100px rgba(56,189,248,0.35); opacity: 0; pointer-events: none; transition: opacity 0.3s; }
  </style>
</head>
<body>
  <canvas id="gameCanvas"></canvas>
  <div id="damageOverlay"></div>
  <div id="slowmoOverlay"></div>

  <div id="ui">
    <div class="top-bar">
      <div class="progress-container"><div class="progress-fill" id="progressBar"></div></div>
      <div class="stats-row">
        <div class="badge" id="levelBadge">ZONE 1</div>
        <div class="right-group">
          <div class="badge" style="border-color:#facc15;" id="auraBadge">✨ 0 AURA</div>
          <button class="icon-btn" id="muteBtn" aria-label="Mute" onclick="toggleMute()">🔊</button>
          <button class="icon-btn" id="pauseBtn" aria-label="Pause" onclick="pauseGame()">❚❚</button>
        </div>
      </div>
    </div>

    <div id="bossUI">
      <span>GORILLA KING</span>
      <div class="boss-hp-container"><div class="boss-hp-fill" id="bossHpBar"></div></div>
    </div>

    <div class="tier-announcement" id="tierBadge">FORMATION: GRID</div>
    <div id="hint">⟵ DRAG TO STEER ⟶</div>
  </div>

  <div id="startModal" class="modal">
    <div class="card">
      <h1 style="color:#facc15; text-shadow:0 4px 0 #a16207;">TACTICAL RUSH</h1>
      <p>Pick the right gates to grow your squad.<br>Dodge the Gorilla King's red laser.<br>Spend aura on upgrades between zones!</p>
      <p class="best" id="startBest"></p>
      <p class="essence" id="essenceP"></p>
      <button class="btn gold" onclick="startGame()">TAP TO START</button>
      <button class="btn violet" id="metaBtn" onclick="openMetaShop()">⬡ UPGRADES</button>
      <div id="chestBox"></div>
      <div class="legal"><a id="privacyLink" href="#" target="_blank" rel="noopener">Privacy policy</a><button id="privOptBtn" style="display:none" onclick="BRAds.showPrivacyOptions()">Privacy options</button></div>
    </div>
  </div>

  <div id="endModal" class="modal" style="display:none;">
    <div class="card">
      <h1 id="endTitle">STAGE CLEAR!</h1>
      <p id="endDesc">Boss Defeated!</p>
      <p class="best" id="endBest"></p>
      <div id="shop"></div>
      <div id="adOffers"></div>
      <button class="btn" id="nextBtn" onclick="nextLevel()">CONTINUE</button>
    </div>
  </div>

  <div id="metaShop" class="modal" style="display:none;">
    <div class="card">
      <h1>UPGRADES</h1>
      <p class="essence" id="metaEssence" style="margin:0 0 12px"></p>
      <div id="metaList"></div>
      <button class="btn" onclick="closeMetaShop()">BACK</button>
    </div>
  </div>

  <div id="pauseModal" class="modal" style="display:none;">
    <div class="card">
      <h1>PAUSED</h1>
      <p id="pauseDesc">Take a breather.</p>
      <button class="btn gold" onclick="resumeGame()">RESUME</button>
      <button class="btn ghost" id="pauseMuteBtn" onclick="toggleMute()">SOUND: ON</button>
      <button class="btn ghost" id="pauseVibeBtn" onclick="toggleVibe()">VIBRATION: ON</button>
      <button class="btn ghost" onclick="quitToTitle()">END RUN</button>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/ads.js"></script>
  <script src="js/sprites.js"></script>
  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d', { alpha: false });
    const $ = id => document.getElementById(id);
    const FONT = 'GameFont, "Arial Black", Impact, Roboto, Arial, sans-serif';
    const font = px => `${px}px ${FONT}`;

    // Older Android System WebViews (Chrome < 99) lack roundRect; without it gate labels throw every frame.
    if (!CanvasRenderingContext2D.prototype.roundRect) {
      CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
        r = Math.max(0, Math.min(typeof r === 'number' ? r : 0, w / 2, h / 2));
        this.moveTo(x + r, y); this.arcTo(x + w, y, x + w, y + h, r); this.arcTo(x + w, y + h, x, y + h, r);
        this.arcTo(x, y + h, x, y, r); this.arcTo(x, y, x + w, y, r); this.closePath();
      };
    }

    // ----- Native (Capacitor) bridge: absent in a plain browser, so every call is optional -----
    const Native = (window.Capacitor && window.Capacitor.Plugins) || {};
    const isNative = !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform());
    let lastBuzz = 0;
    function buzz(kind) {
      if (!save.vibe) return;
      const now = performance.now(); if (now - lastBuzz < 90) return; lastBuzz = now;
      try {
        if (Native.Haptics) {
          if (kind === 'heavy') Native.Haptics.impact({ style: 'HEAVY' });
          else if (kind === 'success') Native.Haptics.notification({ type: 'SUCCESS' });
          else Native.Haptics.impact({ style: 'LIGHT' });
        } else if (navigator.vibrate) navigator.vibrate(kind === 'heavy' ? 40 : 15);
      } catch (e) { /* haptics unavailable */ }
    }

    // ----- Screen / scaling: canvas is backed at devicePixelRatio, world is scaled to fit the road -----
    const ROAD_HALF = 190;                 // half road width in world units
    let W = 0, H = 0, DPR = 1, VS = 1;     // CSS size, pixel ratio, world->CSS scale
    function resize() {
      DPR = Math.min(window.devicePixelRatio || 1, 3);
      W = window.innerWidth; H = window.innerHeight;
      canvas.width = Math.round(W * DPR); canvas.height = Math.round(H * DPR);
      VS = Math.max(0.6, Math.min(W / 420, H / 760));
    }
    window.addEventListener('resize', resize);
    resize();

    // ----- Persistence -----
    const SAVE_KEY = 'brainrot-aura-rush-v1';
    let save = { bestAura: 0, bestZone: 0, muted: false, vibe: true, ads: { day: '', count: 0, chest: 0 }, chestDay: '', chestAmt: 0 };
    try { save = Object.assign(save, JSON.parse(localStorage.getItem(SAVE_KEY) || '{}')); } catch (e) { /* storage unavailable */ }
    if (!save.ads || typeof save.ads !== 'object') save.ads = { day: '', count: 0, chest: 0 };
    function persist() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) { /* ignore */ } }
    function recordBest() {
      save.bestAura = Math.max(save.bestAura, Math.round(aura));
      save.bestZone = Math.max(save.bestZone, level);
      persist();
    }
    const bestText = () => save.bestZone ? `BEST: ZONE ${save.bestZone} · ✨ ${save.bestAura}` : '';

    // ----- Essence: permanent meta-progression (ported from 74ce0a6, adapted to this game) -----
    // Runs earn Essence on a wipe-out or when you end a run; it buys permanent levels that apply to every new run.
    const META_UPS = [
      { id: 'hp',      n: 'Vigor',   d: '+2 starting troopers per level', i: '♥',  max: 10, base: 15, grow: 1.22 },
      { id: 'dmg',     n: 'Power',   d: '+4% bullet damage per level',    i: '⚡', max: 10, base: 18, grow: 1.24 },
      { id: 'spd',     n: 'Haste',   d: '+3% fire rate per level',        i: '💨', max: 8,  base: 14, grow: 1.22 },
      { id: 'luck',    n: 'Greed',   d: '+8% aura earned per level',      i: '🧲', max: 8,  base: 12, grow: 1.2 },
      { id: 'harvest', n: 'Harvest', d: '+10% Essence earned per level',  i: '🔮', max: 10, base: 20, grow: 1.26 },
    ];
    const META_KEY = 'as_meta';
    let meta = { essence: 0, lv: {} };
    try {
      const m = JSON.parse(localStorage.getItem(META_KEY) || 'null');
      if (m && typeof m === 'object') {
        if (Number.isFinite(m.essence) && m.essence >= 0) meta.essence = Math.floor(m.essence);
        if (m.lv && typeof m.lv === 'object') meta.lv = m.lv;
      }
    } catch (e) { /* storage unavailable */ }
    META_UPS.forEach(u => { const v = meta.lv[u.id]; meta.lv[u.id] = Number.isFinite(v) ? Math.max(0, Math.min(u.max, Math.floor(v))) : 0; });
    function saveMeta() { try { localStorage.setItem(META_KEY, JSON.stringify(meta)); } catch (e) { /* ignore */ } }
    const metaCost = u => Math.floor(u.base * Math.pow(u.grow, meta.lv[u.id]));
    function renderEssence() { $('essenceP').textContent = `◈ ${meta.essence.toLocaleString()} ESSENCE`; }
    function awardEssence(n) {
      n = Math.max(0, Math.floor(n * (1 + meta.lv.harvest * 0.1)));
      if (n > 0) { meta.essence += n; saveMeta(); renderEssence(); }
      return n;
    }
    function renderMetaShop() {
      const list = $('metaList'); list.innerHTML = '';
      for (const u of META_UPS) {
        const lv = meta.lv[u.id], maxed = lv >= u.max, cost = metaCost(u);
        const b = document.createElement('button');
        b.className = 'upg'; b.dataset.meta = u.id; b.disabled = maxed || meta.essence < cost;
        b.innerHTML = `<span class="ico">${u.i}</span><span class="txt"><span class="nm">${u.n.toUpperCase()} · LV ${lv}/${u.max}</span><span class="ds">${u.d}</span><span class="pips">${'■'.repeat(lv)}${'□'.repeat(u.max - lv)}</span></span><span class="cost">${maxed ? 'MAX' : '◈ ' + cost}</span>`;
        b.onclick = () => buyMeta(u);
        list.appendChild(b);
      }
      $('metaEssence').textContent = `◈ ${meta.essence.toLocaleString()} Essence available`;
    }
    function buyMeta(u) {
      const cost = metaCost(u);
      if (meta.lv[u.id] >= u.max || meta.essence < cost) return;
      meta.essence -= cost; meta.lv[u.id]++; saveMeta();
      playSound('powerup'); buzz('light'); renderMetaShop(); renderEssence();
    }
    function openMetaShop() { initAudio(); renderMetaShop(); $('startModal').style.display = 'none'; $('metaShop').style.display = 'flex'; }
    function closeMetaShop() { $('metaShop').style.display = 'none'; renderEssence(); $('startModal').style.display = 'flex'; }

    // ----- Audio -----
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let actx, master, lastShootSound = 0;
    function initAudio() {
      if (!AudioContext) return;
      if (!actx) { actx = new AudioContext(); master = actx.createGain(); master.connect(actx.destination); }
      master.gain.value = save.muted ? 0 : 1;
      if (actx.state === 'suspended') actx.resume();
    }
    function playSound(type) {
      if (!actx || save.muted) return;
      const now = actx.currentTime;
      if (type === 'shoot') { if (now - lastShootSound < 0.16) return; lastShootSound = now; }
      const osc = actx.createOscillator(), gain = actx.createGain();
      osc.connect(gain); gain.connect(master);
      if (type === 'shoot') {
        osc.type = 'square'; osc.frequency.setValueAtTime(600, now); osc.frequency.exponentialRampToValueAtTime(300, now + 0.05);
        gain.gain.setValueAtTime(0.012, now); gain.gain.exponentialRampToValueAtTime(0.004, now + 0.05);
        osc.start(now); osc.stop(now + 0.05);
      } else if (type === 'hit') {
        osc.type = 'sawtooth'; osc.frequency.setValueAtTime(200, now); osc.frequency.exponentialRampToValueAtTime(50, now + 0.1);
        gain.gain.setValueAtTime(0.08, now); gain.gain.linearRampToValueAtTime(0, now + 0.1);
        osc.start(now); osc.stop(now + 0.1);
      } else if (type === 'powerup') {
        osc.type = 'sine'; osc.frequency.setValueAtTime(800, now); osc.frequency.setValueAtTime(1200, now + 0.2);
        gain.gain.setValueAtTime(0.1, now); gain.gain.linearRampToValueAtTime(0, now + 0.4);
        osc.start(now); osc.stop(now + 0.4);
      } else if (type === 'laser') {
        osc.type = 'sawtooth'; osc.frequency.setValueAtTime(100, now); osc.frequency.linearRampToValueAtTime(50, now + 0.8);
        gain.gain.setValueAtTime(0.25, now); gain.gain.linearRampToValueAtTime(0, now + 0.8);
        osc.start(now); osc.stop(now + 0.8);
      } else if (type === 'damage') {
        osc.type = 'square'; osc.frequency.setValueAtTime(120, now); osc.frequency.exponentialRampToValueAtTime(20, now + 0.3);
        gain.gain.setValueAtTime(0.18, now); gain.gain.linearRampToValueAtTime(0, now + 0.3);
        osc.start(now); osc.stop(now + 0.3);
      }
    }
    function toggleMute() {
      save.muted = !save.muted; persist();
      if (master) master.gain.value = save.muted ? 0 : 1;
      updateMuteUI();
    }
    function updateMuteUI() {
      $('muteBtn').textContent = save.muted ? '🔇' : '🔊';
      $('pauseMuteBtn').textContent = save.muted ? 'SOUND: OFF' : 'SOUND: ON';
      $('pauseVibeBtn').textContent = save.vibe ? 'VIBRATION: ON' : 'VIBRATION: OFF';
    }
    function toggleVibe() { save.vibe = !save.vibe; persist(); updateMuteUI(); buzz('light'); }

    // ----- Game state -----
    let state = 'START', pausedFrom = null;
    let runKills = 0, runAuraEarned = 0, runAwarded = true; // Essence inputs for the current run
    let level = 1, aura = 0, trackProgress = 0, trackLength = 6000, baseSpeed = 240, screenShake = 0;
    let timeScale = 1.0, slowMoTimer = 0, zoneTime = 0, lastStandUsed = false, damageFlash = 0;
    let shieldCharges = 0, carrySquad = 0, zoneAuraStart = 0;
    // Rewarded-ad caps: one revive per run, one Essence double per run end, one aura bonus per zone clear.
    let runRevived = false, runDoubled = false, zoneBonusUsed = false, deathState = 'PLAYING', lastGained = 0;
    const ZONE_COLORS = { train: [19, 33, 66], industrial: [74, 29, 10], arena: [59, 7, 100] };
    let bgColor = ZONE_COLORS.train.slice();

    const UPGRADES = {
      recruits: { name: 'RECRUITS', ico: '🪖', desc: '+4 starting troopers', max: 5, base: 1500 },
      rate:     { name: 'TRIGGER FINGER', ico: '⚡', desc: '+15% fire rate', max: 5, base: 2000 },
      dmg:      { name: 'AURA ROUNDS', ico: '💥', desc: '+20% bullet damage', max: 5, base: 2000 },
      shield:   { name: 'AURA SHIELD', ico: '🛡️', desc: 'Blocks 1 hit each zone', max: 3, base: 3000 },
    };
    let upgrades = { recruits: 0, rate: 0, dmg: 0, shield: 0 };

      ctx.fillStyle = adjustBrightness(hexColor, -25); ctx.beginPath(); ctx.moveTo(isoX, isoY - h); ctx.lineTo(isoX + w/2, isoY - h - d/3); ctx.lineTo(isoX + w/2, isoY - d/3); ctx.lineTo(isoX, isoY); ctx.closePath(); ctx.fill();
      ctx.fillStyle = adjustBrightness(hexColor, -45); ctx.beginPath(); ctx.moveTo(isoX, isoY - h); ctx.lineTo(isoX - w/2, isoY - h - d/3); ctx.lineTo(isoX - w/2, isoY - d/3); ctx.lineTo(isoX, isoY); ctx.closePath(); ctx.fill();
    }
    function adjustBrightness(hex, percent) {
      let num = parseInt(hex.replace("#",""), 16), amt = Math.round(2.55 * percent);
      let R = (num >> 16) + amt, G = (num >> 8 & 0x00FF) + amt, B = (num & 0x0000FF) + amt;
      return "#" + (0x1000000 + (R<255?R<1?0:R:255)*0x10000 + (G<255?G<1?0:G:255)*0x100 + (B<255?B<1?0:B:255)).toString(16).slice(1);
    }
    function drawShadow(ctx, x, y, radius) { ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.beginPath(); ctx.ellipse(x, y - radius*0.2, radius, radius*0.3, 0, 0, Math.PI*2); ctx.fill(); }

    // Gate colours by effect: green = growth, red = loss, blue = formation, gold = aura
    function gateColor(side) {
      if (side.isBad) return '#ef4444';
      if (side.type === 'SQUAD') return '#22c55e';
      if (side.type === 'FORM') return '#38bdf8';
      return '#facc15';
    }
    function mixWhite(hex, t) {
      const n = parseInt(hex.slice(1), 16), m = c => Math.round(c + (255 - c) * t);
      return `rgb(${m(n >> 16)},${m((n >> 8) & 255)},${m(n & 255)})`;
    }
    function drawGate(side, y) {
      const col = gateColor(side), flash = Math.min(1, side.hitTime / 0.12);
      const c = flash > 0 ? mixWhite(col, flash * 0.75) : col;
      ctx.save(); ctx.translate(side.x, y);
      ctx.globalAlpha = 0.28 + flash * 0.3; ctx.fillStyle = c; ctx.fillRect(-88, -7, 176, 14);
      ctx.globalAlpha = 1; ctx.strokeStyle = c; ctx.lineWidth = 4; ctx.strokeRect(-88, -7, 176, 14);
      ctx.scale(1, -1);
      let text = side.text; if (side.type === 'SQUAD' && !side.isBad) text = `+${Math.round(side.val)} SQUAD`;
      ctx.font = font(15); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      const tw = Math.min(170, ctx.measureText(text).width + 18);
      ctx.fillStyle = 'rgba(2,6,23,0.85)'; ctx.beginPath(); ctx.roundRect(-tw / 2, 13, tw, 24, 12); ctx.fill();
      ctx.strokeStyle = col; ctx.lineWidth = 2; ctx.stroke();
      ctx.fillStyle = side.isBad ? '#fecaca' : '#ffffff'; ctx.fillText(text, 0, 26, 160);
      ctx.restore();
    }

    const h0boss = () => Sprites.CAST.boss.h * 0.85 * 0.8 - 12; // boss feet below its anchor (shadow sits there)
    function render(rawDt) {
      // Zone atmosphere drawn on the canvas itself: blue -> industrial orange -> purple arena
      const pct = trackProgress / trackLength;
      const target = (state === 'BOSS' || pct >= 0.8) ? ZONE_COLORS.arena : pct >= 0.4 ? ZONE_COLORS.industrial : ZONE_COLORS.train;
      const k = Math.min(1, (rawDt || 0.016) * 1.5);
      for (let i = 0; i < 3; i++) bgColor[i] += (target[i] - bgColor[i]) * k;
      const bg = `rgb(${bgColor.map(Math.round).join(',')})`;
      ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
      ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);
      const vg = ctx.createLinearGradient(0, 0, 0, H);
      vg.addColorStop(0, 'rgba(2,6,23,0.55)'); vg.addColorStop(0.5, 'rgba(2,6,23,0)'); vg.addColorStop(1, 'rgba(2,6,23,0.35)');
      ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
      document.body.style.backgroundColor = bg;
      $('damageOverlay').style.opacity = damageFlash > 0 ? '1' : '0';
      if (damageFlash > 0) damageFlash -= rawDt || 0.016;

      const cy = H * 0.8;
      ctx.save();
      if (screenShake > 0) ctx.translate((Math.random() - 0.5) * screenShake, (Math.random() - 0.5) * screenShake);
      ctx.translate(W / 2, cy); ctx.scale(VS, VS);
      const top = -cy / VS, bottom = (H - cy) / VS;

      ctx.fillStyle = 'rgba(2, 6, 23, 0.45)'; ctx.fillRect(-ROAD_HALF, top, ROAD_HALF * 2, bottom - top);
      ctx.fillStyle = '#38bdf8'; ctx.fillRect(-ROAD_HALF - 8, top, 8, bottom - top); ctx.fillRect(ROAD_HALF, top, 8, bottom - top);
      const spacing = 180, offset = -(trackProgress % spacing);
      ctx.strokeStyle = 'rgba(56, 189, 248, 0.2)'; ctx.lineWidth = 4;
      for (let y = top + offset - spacing; y < bottom + spacing; y += spacing) { ctx.beginPath(); ctx.moveTo(-ROAD_HALF, y); ctx.lineTo(ROAD_HALF, y); ctx.stroke(); }

      ctx.save(); ctx.scale(1, -1); ctx.translate(0, -trackProgress);

      if (state !== 'START' && boss && boss.active && (boss.state === 'TELEGRAPH' || boss.state === 'STRIKE')) {
        const strike = boss.state === 'STRIKE';
        const y0 = trackProgress - 260, len = boss.y - trackProgress + 260;
        for (const lx of boss.lanes) {
          ctx.fillStyle = strike ? 'rgba(239, 68, 68, 0.85)' : 'rgba(239, 68, 68, 0.28)';
          ctx.fillRect(lx - 60, y0, 120, len);
          if (strike) { ctx.fillStyle = 'rgba(255,255,255,0.75)'; ctx.fillRect(lx - 14, y0, 28, len); }
          else { ctx.strokeStyle = 'rgba(239,68,68,0.9)'; ctx.lineWidth = 3; ctx.setLineDash([14, 10]); ctx.strokeRect(lx - 60, y0, 120, len); ctx.setLineDash([]); }
        }
      }

      for (const g of entities.gates) { if (!g.active) continue; drawGate(g.left, g.y); drawGate(g.right, g.y); }

      // Characters are atlas sprites (js/sprites.js). They're drawn in an un-flipped pass, centred on the same anchor
      // the hitboxes use, so gameplay and collisions are unchanged.
      const anim = Math.floor(performance.now() / 160) & 1;
      for (const e of entities.enemies) if (e.active) { const t = e.type === 'TANK'; drawShadow(ctx, e.x, e.y - (t ? 58 * 1.15 : 52 * 1.1) * 0.42 + 6, t ? 34 : 20); }
      ctx.save(); ctx.scale(1, -1);
      for (let i = entities.enemies.length - 1; i >= 0; i--) {   // far (higher y) first so nearer ones overlap
        const e = entities.enemies[i]; if (!e.active) continue;
        const key = e.type === 'TANK' ? 'tank' : (e.skin || 'swarmA'), sp = Sprites.CAST[key];
        const sc = e.type === 'TANK' ? 1.15 : 1.1, h = sp.h * sc, footY = -e.y + h * 0.42;
        Sprites.draw(ctx, key, e.hitTime > 0 ? 'hit' : (anim ^ (e.phase > Math.PI ? 1 : 0)), e.x, footY, sc);
        const by = footY - h - 7;
        ctx.fillStyle = '#000'; ctx.fillRect(e.x - 20, by, 40, 6);
        ctx.fillStyle = '#ef4444'; ctx.fillRect(e.x - 20, by, 40 * Math.max(0, e.hp / e.maxHp), 6);
      }
      ctx.restore();

      if (boss && boss.active) {
        drawShadow(ctx, boss.x, boss.y - h0boss(), 90);
        const angry = boss.state === 'TELEGRAPH' || boss.state === 'STRIKE', sc = 0.85, h = Sprites.CAST.boss.h * sc;
        ctx.save(); ctx.scale(1, -1);
        Sprites.draw(ctx, 'boss', boss.hitTime > 0 ? 'hit' : angry ? 2 : (Math.floor(performance.now() / 420) & 1), boss.x, -boss.y + h * 0.8, sc);
        ctx.restore();
      }

      ctx.lineWidth = 6; ctx.lineCap = 'round'; ctx.strokeStyle = '#38bdf8';
      ctx.beginPath();
      for (const b of entities.bullets) { ctx.moveTo(b.x, b.y); ctx.lineTo(b.x, b.y - 20); }
      ctx.stroke();

      if (state !== 'START') {
        ctx.save(); ctx.translate(squad.drawX, trackProgress);
        const count = Math.max(1, Math.ceil(squad.visualCount));
        const { slots, hw } = formationLayout(count, squad.formation);
        drawShadow(ctx, 0, 0, Math.max(40, hw + 10));
        if (shieldCharges > 0) {
          ctx.strokeStyle = 'rgba(250,204,21,0.7)'; ctx.lineWidth = 3;
          ctx.beginPath(); ctx.ellipse(0, -10, hw + 22, (hw + 22) * 0.4, 0, 0, Math.PI * 2); ctx.stroke();
        }
        ctx.save(); ctx.scale(1, -1);
        let depth = 0; for (const s of slots) depth = Math.max(depth, -s[1]);
        // squad commander hovers beside the squad, off to the rear-left
        const lh = Sprites.CAST.leader.h * 0.8, hover = Math.sin(performance.now() / 260) * 3;
        Sprites.draw(ctx, 'leader', anim, -(hw + 22), depth * 0.5 + lh * 0.5 + hover, 0.8);
        const th = Sprites.CAST.trooper.h * 0.82;
        slots.forEach(([ox, oy], i) => {
          const bob = Math.abs(Math.sin((trackProgress * 0.15) + i)) * 4;
          Sprites.draw(ctx, 'trooper', (anim + i) & 1, ox, -oy + th * 0.45 - bob, 0.82);
        });
        const label = `x${Math.max(0, Math.ceil(squad.count))}`;
        ctx.font = font(14); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        const lw = Math.max(60, ctx.measureText(label).width + 22);
        const py = depth + 26; // pill sits just behind the last row
        ctx.fillStyle = '#0f172a'; ctx.beginPath(); ctx.roundRect(-lw / 2, py, lw, 24, 12); ctx.fill();
        ctx.strokeStyle = '#38bdf8'; ctx.lineWidth = 2; ctx.stroke();
        ctx.fillStyle = '#fff'; ctx.fillText(label, 0, py + 13);
        ctx.restore();
        ctx.restore();
      }

      for (const p of entities.particles) { ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill(); }
      ctx.font = font(20); ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic'; ctx.lineWidth = 4; ctx.strokeStyle = '#000';
      for (const t of entities.texts) {
        ctx.save(); ctx.translate(t.x, t.y); ctx.scale(1, -1);
        ctx.globalAlpha = Math.min(1, t.life * 3); ctx.fillStyle = t.color;
        ctx.strokeText(t.str, 0, 0); ctx.fillText(t.str, 0, 0);
        ctx.restore();
      }
      ctx.restore(); ctx.restore();
    }

    // ----- End of zone / run -----
    function renderShop() {
      const shop = $('shop');
      shop.innerHTML = '<h2>SPEND AURA ON UPGRADES</h2>';
      for (const k of Object.keys(UPGRADES)) {
        const u = UPGRADES[k], lvl = upgrades[k], maxed = lvl >= u.max, cost = upgradeCost(k);
        const b = document.createElement('button');
        b.className = 'upg'; b.dataset.upg = k; b.disabled = maxed || aura < cost;
        b.innerHTML = `<span class="ico">${u.ico}</span><span class="txt"><span class="nm">${u.name}</span><span class="ds">${u.desc}</span><span class="pips">${'■'.repeat(lvl)}${'□'.repeat(u.max - lvl)}</span></span><span class="cost">${maxed ? 'MAX' : '✨ ' + cost}</span>`;
        b.onclick = () => buyUpgrade(k);
        shop.appendChild(b);
      }
    }
    function buyUpgrade(k) {
      const cost = upgradeCost(k);
      if (upgrades[k] >= UPGRADES[k].max || aura < cost) return;
      aura -= cost; upgrades[k]++; updateAuraUI(); playSound('powerup');
      $('endDesc').textContent = `Boss defeated! ✨ ${Math.round(aura)} aura to spend. ${Math.min(40, Math.round(squad.count * 0.5))} troopers carry over.`;
      renderShop();
    }
    function victory() {
      state = 'VICTORY'; recordBest();
      $('endTitle').textContent = 'STAGE CLEAR!'; $('endTitle').style.color = '#38bdf8';
      $('endDesc').textContent = `Boss defeated! ✨ ${Math.round(aura)} aura to spend. ${Math.min(40, Math.round(squad.count * 0.5))} troopers carry over.`;
      $('endBest').textContent = bestText();
      $('shop').style.display = 'flex'; renderShop();
      $('nextBtn').textContent = 'NEXT ZONE'; $('nextBtn').className = 'btn';
      renderAdOffers();
      $('bossUI').style.display = 'none'; $('endModal').style.display = 'flex';
      slowMoTimer = 0; $('slowmoOverlay').style.opacity = '0';
    }
    function gameOver() {
      deathState = state === 'BOSS' ? 'BOSS' : 'PLAYING';
      state = 'GAMEOVER'; recordBest(); const gained = endRunEssence(); lastGained = gained;
      $('endTitle').textContent = 'CRASHED OUT!'; $('endTitle').style.color = '#ef4444';
      setGameOverText();
      renderAdOffers();
      $('endBest').textContent = bestText();
      $('shop').style.display = 'none'; $('bossUI').style.display = 'none';
      slowMoTimer = 0; $('slowmoOverlay').style.opacity = '0';
      $('nextBtn').textContent = 'NEW RUN'; $('nextBtn').className = 'btn gold';
      $('endModal').style.display = 'flex';
    }
    function setGameOverText() {
      $('endDesc').textContent = `Your squad was wiped out in Zone ${level}. Run aura: ✨ ${Math.round(aura)}. Essence: ◈ +${lastGained * (runDoubled ? 2 : 1)}${runDoubled ? ' (doubled!)' : ''} (spend it in UPGRADES).`;
    }

    // ----- Opt-in rewarded ads (Android only; see js/ads.js). Every offer is a button the player may ignore. -----
    const reviveCount = () => Math.max(12, Math.round((8 + upgrades.recruits * 4 + meta.lv.hp * 2) * 0.75));
    const zoneBonus = () => Math.max(250, Math.round(Math.max(0, aura - zoneAuraStart) * 0.5));
    function adButton(id, label, onTap) {
      const b = document.createElement('button'); b.className = 'btn ad'; b.id = id; b.textContent = '▶ ' + label;
      b.onclick = async () => {
        document.querySelectorAll('.btn.ad').forEach(x => x.disabled = true);
        const ok = await BRAds.show(save.ads, id === 'adChest' ? 'chest' : id); persist();
        if (ok) { playSound('powerup'); buzz('success'); onTap(); }
        renderAdOffers(); renderChest();
      };
      return b;
    }
    function renderAdOffers() {
      const box = $('adOffers'); if (!box) return; box.innerHTML = '';
      if (state === 'GAMEOVER') {
        if (!runRevived && !runDoubled && BRAds.canOffer(save.ads, 'revive')) box.appendChild(adButton('revive', `REVIVE (+${reviveCount()} TROOPERS)`, reviveRun));
        if (!runDoubled && lastGained > 0 && BRAds.canOffer(save.ads, 'double')) box.appendChild(adButton('double', `DOUBLE ESSENCE (+${lastGained})`, doubleEssence));
      } else if (state === 'VICTORY') {
        if (!zoneBonusUsed && BRAds.canOffer(save.ads, 'zone')) box.appendChild(adButton('zone', `BONUS AURA (+${zoneBonus()})`, () => {
          zoneBonusUsed = true; aura += zoneBonus(); updateAuraUI();
          $('endDesc').textContent = `Boss defeated! ✨ ${Math.round(aura)} aura to spend. ${Math.min(40, Math.round(squad.count * 0.5))} troopers carry over.`;
          renderShop();
        }));
      }
    }
    function reviveRun() {
      if (state !== 'GAMEOVER' || runRevived) return;
      runRevived = true;
      // undo this wipe-out's Essence; the run continues and pays out when it really ends
      meta.essence = Math.max(0, meta.essence - lastGained); lastGained = 0; runAwarded = false; saveMeta(); renderEssence();
      squad.count = reviveCount(); squad.visualCount = squad.count; shieldCharges = Math.max(shieldCharges, 1); lastStandUsed = false;
      for (const e of entities.enemies) if (e.y > trackProgress - 100 && e.y < trackProgress + 700) e.active = false;
      if (boss && boss.active) { boss.state = 'IDLE'; boss.timer = 2.5; boss.lanes = []; $('bossUI').style.display = 'flex'; }
      addFloatText(squad.x, trackProgress + 100, 'REVIVED!', '#4ade80');
      $('endModal').style.display = 'none'; $('adOffers').innerHTML = '';
      state = deathState; lastTime = performance.now(); if (actx) actx.resume();
    }
    function doubleEssence() {
      if (state !== 'GAMEOVER' || runDoubled || lastGained <= 0) return;
      runDoubled = true; meta.essence += lastGained; saveMeta(); renderEssence(); setGameOverText();
    }

    // Daily chest: free Essence once a day; one optional ad reroll per day keeps the better roll.
    const chestRoll = () => 10 + Math.floor(Math.random() * 21) + 3 * Math.min(save.bestZone || 0, 20);
    function openChest() {
      const today = BRAds.dayKey(); if (save.chestDay === today) return;
      const n = chestRoll(); save.chestDay = today; save.chestAmt = n; persist();
      meta.essence += n; saveMeta(); renderEssence(); playSound('powerup'); buzz('success'); renderChest();
    }
    function rerollChest() {
      const n = chestRoll(), gain = Math.max(0, n - save.chestAmt);
      save.chestAmt = Math.max(save.chestAmt, n); persist();
      if (gain > 0) { meta.essence += gain; saveMeta(); renderEssence(); }
      $('chestBox').dataset.reroll = gain > 0 ? `Rerolled: ◈ ${n}! +${gain} more Essence` : `Rerolled: ◈ ${n}. You kept your ◈ ${save.chestAmt}`;
    }
    function renderChest() {
      const box = $('chestBox'); if (!box) return; box.innerHTML = '';
      const today = BRAds.dayKey();
      if (save.chestDay !== today) {
        const b = document.createElement('button'); b.className = 'btn chest'; b.id = 'chestBtn'; b.textContent = '🎁 DAILY CHEST'; b.onclick = () => { initAudio(); openChest(); };
        box.appendChild(b); return;
      }
      const p = document.createElement('p'); p.textContent = box.dataset.reroll || `🎁 Today's chest: ◈ ${save.chestAmt} Essence. New chest tomorrow.`; box.appendChild(p);
      if (BRAds.canOffer(save.ads, 'chest')) box.appendChild(adButton('adChest', 'REROLL CHEST (KEEP BEST)', rerollChest));
    }
    window.onAdsReady = () => { renderChest(); renderAdOffers(); $('privOptBtn').style.display = BRAds.privacyRequired() ? '' : 'none'; };

    function nextLevel() {
      if (state === 'VICTORY') { carrySquad = Math.min(40, Math.round(squad.count * 0.5)); level++; initLevel(); }
      else if (state === 'GAMEOVER') newRun();
    }

    Sprites.build();
    $('startBest').textContent = bestText();
    renderEssence();
    updateMuteUI();
    $('privacyLink').href = (window.BR_CONFIG && BR_CONFIG.PRIVACY_URL) || 'privacy-policy.html';
    renderChest();
    BRAds.init();
    if (document.fonts && document.fonts.load) document.fonts.load(font(16)).catch(() => {});
    requestAnimationFrame(loop);
  </script>
</body>
</html>
