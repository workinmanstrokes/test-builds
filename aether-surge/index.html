<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Aether Surge</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#06060e;font-family:system-ui,sans-serif;color:#e8f0ff}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;background:#06060e}
#ui{position:fixed;inset:0;pointer-events:none;z-index:10}
#touch{position:absolute;inset:0;pointer-events:auto;z-index:1;display:none}
.hud{position:absolute;top:0;left:0;right:104px;padding:10px 0 0 14px;padding-top:max(10px,env(safe-area-inset-top,10px));display:none;flex-direction:column;gap:5px;z-index:5}
.bar-row{display:flex;align-items:center;gap:8px}
.bar-bg{flex:1;height:13px;background:rgba(0,0,0,.6);border-radius:7px;overflow:hidden;border:1px solid rgba(100,150,255,.3)}
.bar-fill{height:100%;border-radius:7px;width:0%}
#hpF{background:linear-gradient(90deg,#ff2a4a,#ff6b8a);width:100%}
#xpF{background:linear-gradient(90deg,#2a8cff,#6bc8ff)}
.stat{font-size:12px;font-weight:800;min-width:48px}
#pl{position:absolute;top:calc(env(safe-area-inset-top,0px) + 58px);right:14px;font-size:16px;font-weight:900;color:#ffe566;text-shadow:0 0 12px #ffaa00;display:none}
#kc{position:absolute;top:calc(env(safe-area-inset-top,0px) + 80px);right:14px;font-size:12px;font-weight:700;color:#c8d8ff;display:none}
#tm{position:absolute;top:calc(env(safe-area-inset-top,0px) + 58px);left:50%;transform:translateX(-50%);font-size:22px;font-weight:900;color:#fff;text-shadow:0 0 10px #3a9fff;display:none}
#tm.boss{color:#ff6a6a;text-shadow:0 0 12px #ff2a2a}
#st{position:absolute;top:calc(env(safe-area-inset-top,0px) + 86px);left:50%;transform:translateX(-50%);font-size:12px;color:#9ec8ff;display:none;white-space:nowrap}
#bossBar{position:absolute;top:calc(env(safe-area-inset-top,0px) + 106px);left:50%;transform:translateX(-50%);width:min(78vw,340px);display:none;text-align:center}
#bossName{font-size:12px;font-weight:900;color:#ffd8d8;text-shadow:0 0 8px #ff2a2a;margin-bottom:3px;letter-spacing:.5px}
#bossBg{height:10px;background:rgba(0,0,0,.65);border:1px solid rgba(255,120,120,.55);border-radius:6px;overflow:hidden}
#bossF{height:100%;width:100%;background:linear-gradient(90deg,#ff2040,#ff8a50)}
#banner{position:absolute;top:38%;left:0;right:0;text-align:center;font-size:20px;font-weight:900;color:#fff;text-shadow:0 0 14px #3a9fff,0 2px 0 #000;opacity:0;transition:opacity .25s;padding:0 16px}
#banner.warn{color:#ffd0a0;text-shadow:0 0 14px #ff5a20,0 2px 0 #000}
#joy{position:absolute;left:84px;top:calc(100% - 110px);width:120px;height:120px;margin:-60px 0 0 -60px;display:none;opacity:.35;z-index:2}
#joy.on{opacity:1}
#jBase{width:120px;height:120px;border-radius:50%;background:rgba(30,50,110,.4);border:2px solid rgba(90,150,255,.45);position:relative}
#jKnob{width:48px;height:48px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#9ec8ff,#2a6ae0);position:absolute;top:36px;left:36px}
.rbtn{position:absolute;top:calc(env(safe-area-inset-top,0px) + 10px);width:38px;height:38px;border-radius:50%;background:rgba(0,0,0,.55);border:1px solid rgba(140,180,255,.4);color:#c8e0ff;font-size:15px;display:none;align-items:center;justify-content:center;pointer-events:auto;z-index:20}
#mute{right:14px}
#pauseBtn{right:58px}
.ov{position:fixed;inset:0;background:rgba(4,6,16,.94);display:none;flex-direction:column;align-items:center;justify-content:center;pointer-events:auto;z-index:50;padding:20px;text-align:center}
.ov h1{font-size:34px;font-weight:900;background:linear-gradient(135deg,#6ab0ff,#ffe566,#ff6b9a);-webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:8px}
.ov p{font-size:14px;color:#a8c8ff;margin-bottom:16px;max-width:300px}
.btn{background:linear-gradient(135deg,#2a6ae0,#1a4aaa);border:2px solid #8ab8ff;color:#fff;font-size:16px;font-weight:800;padding:12px 32px;border-radius:26px;margin:6px;cursor:pointer;min-width:200px}
.btn.alt{background:linear-gradient(135deg,#333a55,#22283d);border-color:#7a88aa;font-size:14px;padding:9px 24px}
.btn:disabled{opacity:.4}
#lvlUp{background:rgba(4,6,16,.88)}
#pause{z-index:60}
.ug{display:flex;flex-direction:column;gap:10px;width:100%;max-width:330px}
.uc{background:rgba(16,24,55,.95);border:2px solid #3a5aaa;border-radius:12px;padding:11px 14px;display:flex;align-items:center;gap:12px;cursor:pointer;text-align:left}
.uc:active{border-color:#8ac0ff}
.uc.asc{border-color:#ffd040;background:rgba(50,40,10,.95)}
.ui{width:40px;height:40px;border-radius:9px;background:linear-gradient(135deg,#2a4aaa,#5a88ee);display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0}
.uf{flex:1}
.uf h3{font-size:14px;margin-bottom:2px;color:#e0f0ff}
.uf p{font-size:11px;color:#8aaddd;margin:0}
.rk{font-size:10px;font-weight:900;color:#ffe566;letter-spacing:.4px;margin-left:6px}
.rk.new{color:#7affc0}
.pips{display:flex;gap:3px;margin-top:4px}
.pip{width:12px;height:4px;border-radius:2px;background:rgba(120,150,220,.3)}
.pip.f{background:#ffe566}
#reroll{margin-top:12px}
.stats{display:grid;grid-template-columns:auto auto;gap:6px 18px;font-size:14px;margin:4px 0 18px;text-align:left}
.stats b{color:#fff}.stats span{color:#9ab8e8}
.nb{color:#ffe566;font-weight:900;font-size:11px;margin-left:6px}
.uc.sig{border-color:#3aa0c0;background:rgba(10,34,50,.95)}
.uc.relic{border-color:#a07a30;background:rgba(40,30,14,.95)}
.pick-cache h1{background:linear-gradient(135deg,#7ae0ff,#b08aff)!important;-webkit-background-clip:text!important;background-clip:text!important}
.pick-relic h1{background:linear-gradient(135deg,#ffd040,#ff8a50)!important;-webkit-background-clip:text!important;background-clip:text!important}
.rk.tag{color:#a8b8d0}
#sigs{position:absolute;top:calc(env(safe-area-inset-top,0px) + 58px);left:12px;display:none;gap:4px;max-width:40vw;flex-wrap:wrap}
.sg{position:relative;width:26px;height:26px;border-radius:7px;background:rgba(0,0,0,.6);border:1px solid #6a8acc;display:flex;align-items:center;justify-content:center;font-size:14px}
.sg b{position:absolute;right:-3px;bottom:-5px;font-size:8px;font-weight:900;color:#ffe566;text-shadow:0 1px 0 #000}
.sg.rl{border-color:#d0a040;color:#ffd060}
#pauseInv{width:100%;max-width:340px;max-height:52vh;overflow-y:auto;text-align:left;font-size:12px;margin:4px 0 12px;pointer-events:auto;touch-action:pan-y}
.inv-h{font-size:11px;font-weight:900;letter-spacing:1px;color:#7aa8dd;margin:8px 0 4px}
.inv-r{padding:4px 6px;border-bottom:1px solid rgba(100,140,220,.15);color:#dce8ff}
.inv-r i{color:#8aaddd;font-style:normal;font-size:11px;display:block}
.inv-r b{color:#ffe566}.inv-i{display:inline-block;width:20px}
.inv-s{display:inline-block;width:72px;color:#7a90b8;font-size:11px}
.dim{color:#5a6a8a}
.mote{color:#9affe0;text-shadow:0 0 8px #3affc0}
#motesP{font-size:14px;font-weight:800;margin-bottom:12px}
#endM{font-size:15px;font-weight:800;margin:-6px 0 14px;color:#dff}
#altarList{display:flex;flex-direction:column;gap:7px;width:100%;max-width:350px;max-height:58vh;overflow-y:auto;touch-action:pan-y}
.ar{background:rgba(16,24,55,.95);border:1px solid #3a5aaa;border-radius:10px;padding:8px 10px;display:flex;align-items:center;gap:10px;text-align:left}
.abtn{min-width:66px;padding:8px 6px;border-radius:16px;border:1px solid #7affd0;background:#124a3a;color:#dfffee;font-weight:800;font-size:12px}
.abtn:disabled{opacity:.4}
#altarMotes{font-size:15px;font-weight:800;margin:0 0 10px}
.abt{position:absolute;border-radius:50%;display:none;align-items:center;justify-content:center;pointer-events:auto;z-index:20;overflow:hidden;color:#fff;font-weight:900;text-shadow:0 1px 0 #000}
.abt .cdf{position:absolute;left:0;right:0;bottom:0;height:0%;background:rgba(0,0,0,.55);pointer-events:none}
.abt span{position:relative;font-size:11px;letter-spacing:.5px;text-align:center;line-height:1.1}
.abt.on{transform:scale(.93)}
#dashBtn{right:18px;bottom:calc(env(safe-area-inset-bottom,0px) + 26px);width:76px;height:76px;background:radial-gradient(circle at 35% 30%,#7ad8ff,#1a5ab0);border:2px solid #bfeaff}
#atkBtn{right:104px;bottom:calc(env(safe-area-inset-bottom,0px) + 44px);width:64px;height:64px;background:radial-gradient(circle at 35% 30%,#8affe0,#108a70);border:2px solid #c8fff0}
#atkBtn .cdf{top:auto;background:rgba(255,240,150,.55)}
#atkBtn.full{box-shadow:0 0 18px #fff}
#mission{position:absolute;top:calc(env(safe-area-inset-top,0px) + 140px);left:50%;transform:translateX(-50%);max-width:92%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12.5px;font-weight:800;color:#ffe566;background:rgba(10,14,30,.6);border:1px solid rgba(255,229,102,.45);border-radius:10px;padding:4px 10px;display:none;pointer-events:none}
.uc.core{border-color:#ffd040;box-shadow:0 0 18px rgba(255,208,64,.45)}
#combo{position:absolute;top:calc(env(safe-area-inset-top,0px) + 172px);right:14px;font-size:15px;font-weight:900;color:#ff8ae0;text-shadow:0 0 10px #ff40c0;display:none}
.tags{display:flex;gap:4px;margin-top:3px;flex-wrap:wrap}
.tagc{font-size:9px;font-weight:800;color:#bcd4ff;background:rgba(80,120,220,.25);border:1px solid rgba(120,160,255,.35);border-radius:6px;padding:0 5px}
.combo{font-size:10px;color:#ffcf70;margin-top:3px}.combo.rdy{color:#ffe566;font-weight:800}
.uc.evo{border-color:#ffd040;background:linear-gradient(135deg,rgba(70,50,10,.97),rgba(40,20,60,.97));box-shadow:0 0 16px rgba(255,208,64,.45)}
#endRec{display:none;font-size:14px;font-weight:900;color:#ffe566;text-shadow:0 0 10px #ffaa00;margin:-4px 0 8px}
.evn{font-style:normal;font-size:11px;color:#ffd040}
.stats{gap:4px 16px;font-size:13px}
#err{display:none;position:fixed;bottom:14px;left:10px;right:10px;background:#3a1020;border:1px solid #ff4466;color:#ffccdd;padding:10px;border-radius:8px;font-size:12px;z-index:100}
#dbg{position:fixed;left:6px;bottom:6px;z-index:90;font:11px/1.35 monospace;color:#b8ffb8;background:rgba(0,0,0,.7);padding:6px 8px;border-radius:6px;pointer-events:auto;display:none;max-width:60vw}
#dbg button{font:11px monospace;margin:3px 3px 0 0;padding:3px 6px;border-radius:4px;border:1px solid #5a8;background:#123;color:#cfc}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <div id="touch"></div>
  <div class="hud" id="hud">
    <div class="bar-row"><span class="stat" id="hpT">100</span><div class="bar-bg"><div class="bar-fill" id="hpF"></div></div></div>
    <div class="bar-row"><span class="stat" id="xpT">LV 1</span><div class="bar-bg"><div class="bar-fill" id="xpF"></div></div></div>
  </div>
  <div id="pl">PL 1,200</div>
  <div id="kc">0 kills</div>
  <div id="tm">5:00</div>
  <div id="sigs"></div>
  <div id="st">Training Rift</div>
  <div id="bossBar"><div id="bossName"></div><div id="bossBg"><div id="bossF"></div></div></div>
  <div id="banner"></div>
  <div id="combo"></div>
  <div id="mission"></div>
  <button class="abt" id="atkBtn" aria-label="Attack (hold to charge)"><div class="cdf" id="atkCd"></div><span>STRIKE<br><small>hold</small></span></button>
  <button class="abt" id="dashBtn" aria-label="Dash"><div class="cdf" id="dashCd"></div><span>DASH</span></button>
  <div id="joy"><div id="jBase"><div id="jKnob"></div></div></div>
  <button class="rbtn" id="mute" aria-label="Mute">🔊</button>
  <button class="rbtn" id="pauseBtn" aria-label="Pause">⏸</button>
</div>
<div class="ov" id="start">
  <h1>AETHER SURGE</h1>
  <p>Survive five minutes in the Training Rift, then destroy the Rift Sentinel.</p>
  <p id="bestP" style="font-size:12px;color:#7aa8dd;margin-top:-8px;margin-bottom:14px"></p>
  <p id="motesP"></p>
  <button class="btn" id="go">TAP TO BEGIN</button>
  <button class="btn alt" id="altarBtn">✦ RESONANCE ALTAR</button>
  <button class="btn alt" id="shakeBtn2">📳 Screen shake: ON</button>
</div>
<div class="ov" id="lvlUp"><h1 id="lvlTitle" style="font-size:22px;margin-bottom:4px">POWER UP</h1><p id="lvlSub" style="font-size:12px;margin-bottom:10px"></p><div class="ug" id="ug"></div><button class="btn alt" id="reroll">↻ REROLL</button></div>
<div class="ov" id="end"><h1 id="endT">DEFEATED</h1><div id="endRec">★ NEW RECORD ★</div><div class="stats" id="endS"></div><div id="endM"></div><button class="btn" id="doubleBtn" style="display:none;background:linear-gradient(135deg,#1a8a8a,#0f5a6a);border-color:#9affe0">✦ DOUBLE MOTES (Watch Ad)</button><button class="btn" id="reviveBtn" style="display:none;background:linear-gradient(135deg,#22a05a,#157a3f);border-color:#8affc0">▶ REVIVE (Watch Ad)</button><button class="btn" id="nx">PLAY AGAIN</button><button class="btn alt" id="menuBtn">MENU</button></div>
<div class="ov" id="pause"><h1 style="font-size:26px">PAUSED</h1><div id="pauseInv"></div><button class="btn" id="resumeBtn">RESUME</button><button class="btn alt" id="shakeBtn">📳 Screen shake: ON</button><button class="btn" id="quitBtn" style="background:linear-gradient(135deg,#7a2a2a,#4a1a1a);border-color:#ff8a8a">QUIT RUN</button></div>
<div class="ov" id="altar"><h1 style="font-size:24px">RESONANCE ALTAR</h1><p style="margin-bottom:6px">Permanent upgrades. Refund any time.</p><div id="altarMotes"></div><div id="altarList"></div><button class="btn alt" id="refundBtn">REFUND ALL</button><button class="btn" id="altarBack">BACK</button></div>
<div id="dbg"></div>
<div id="err"></div>
<script>
window.AS={};
window.onerror=function(m,s,l){var e=document.getElementById("err");if(e){e.style.display="block";e.textContent="Error: "+m+" @"+(s||"").split("/").pop()+":"+l;}return false;};
</script>
<script src="js/data.js"></script>
<script src="js/native.js"></script>
<script src="js/audio.js"></script>
<script src="js/input.js"></script>
<script src="js/render.js"></script>
<script src="js/game.js"></script>
<script src="js/sigils.js"></script>
<script src="js/world.js"></script>
<script src="js/debug.js"></script>
</body>
</html>
